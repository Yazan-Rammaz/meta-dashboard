
name = "meta-whatsapp-dashboard"
main = ".open-next/worker.js"
compatibility_date = "2026-03-06"
compatibility_flags = ["nodejs_compat"]
workers_dev = true  

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
[observability.logs]
enabled = true
invocation_logs = true

[vars]
NEXT_PUBLIC_BASE_URL = "https://staging-backend.ramaaz.store/api/v1"
NEXT_PUBLIC_WHATSAPP_APP_ID = "810815398061683"
NEXT_PUBLIC_WHATSAPP_CONFIG_ID = "1420827336160189"
NEXT_PUBLIC_META_APP_ID = "810815398061683"
NEXT_PUBLIC_META_CONFIG_ID = "1420827336160189"
WHATSAPP_GATEWAY_URL = "https://staging-backend.ramaaz.store/api/v1"
NEXT_PUBLIC_APP_URL = "https://staging-meta-whatsapp-dashboard.yazan-adnof.workers.dev"
NEXT_PUBLIC_API_URL = "https://staging-backend.ramaaz.store/accounting_backend/public/api/v3/whatsapp/messages/receive_message"

