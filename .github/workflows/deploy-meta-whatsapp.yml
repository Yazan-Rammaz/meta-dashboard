name: Deploy staging

on:
  push:
    branches:
      - meta-whatsapp
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NEXT_PUBLIC_* are inlined at build time — must be set here, not in wrangler.toml
      - name: Build (next-on-pages)
        run: npx @cloudflare/next-on-pages
        env:
          NEXT_PUBLIC_BASE_URL: ${{ secrets.STAGING_NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_WHATSAPP_APP_ID: ${{ secrets.NEXT_PUBLIC_WHATSAPP_APP_ID }}
          NEXT_PUBLIC_WHATSAPP_CONFIG_ID: ${{ secrets.NEXT_PUBLIC_WHATSAPP_CONFIG_ID }}
          NEXT_PUBLIC_META_APP_ID: ${{ secrets.NEXT_PUBLIC_META_APP_ID }}
          NEXT_PUBLIC_META_CONFIG_ID: ${{ secrets.NEXT_PUBLIC_META_CONFIG_ID }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.STAGING_NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.STAGING_NEXT_PUBLIC_API_URL }}

      - name: Deploy to Cloudflare Pages (preview)
        run: npx wrangler pages deploy .vercel/output/static --project-name meta-dashboard --branch staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
