name: Deploy meta-whatsapp

on:
  push:
    branches:
      - meta-whatsapp

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_WHATSAPP_APP_ID: ${{ secrets.NEXT_PUBLIC_WHATSAPP_APP_ID }}
          NEXT_PUBLIC_WHATSAPP_CONFIG_ID: ${{ secrets.NEXT_PUBLIC_WHATSAPP_CONFIG_ID }}
          NEXT_PUBLIC_META_APP_ID: ${{ secrets.NEXT_PUBLIC_META_APP_ID }}
          NEXT_PUBLIC_META_CONFIG_ID: ${{ secrets.NEXT_PUBLIC_META_CONFIG_ID }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --env meta-whatsapp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
